apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId 'com.moxi.tvbox'
        targetSdkVersion 28
        versionCode 1
        versionName '0.0.2'
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        // 默认横屏(电视)；由 flavor 覆盖
        manifestPlaceholders = [orientation: "sensorLandscape"]
        // 应用名默认；由 flavor 覆盖
        resValue "string", "app_name", "沫兮TVBox"
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/beans.xml'
    }

    flavorDimensions "ui"
    productFlavors {
        leanback {
            dimension "ui"
            applicationId "com.moxi.tvbox.tv"   // 电视版：横屏盒子UI
            versionName "0.0.2"
            minSdkVersion 19
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            manifestPlaceholders = [orientation: "sensorLandscape"]
            resValue "string", "app_name", "沫兮TVBox-TV"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        mobile {
            dimension "ui"
            applicationId "com.moxi.tvbox.mobile" // 手机版：自适应竖屏/横屏
            versionName "0.0.2"
            minSdkVersion 21
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
            manifestPlaceholders = [orientation: "unspecified"]
            resValue "string", "app_name", "沫兮TVBox"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        leanback {
            java.srcDirs += 'src/normal/java'
        }
        mobile {
            java.srcDirs += 'src/normal/java'
        }
    }

    // 签名：优先读环境变量(GitHub Secrets 云编译)，回退读 gradle.properties(本地构建)
    def ksFile  = System.getenv('KFTV_KEYSTORE_FILE')
    def ksAlias = System.getenv('KFTV_KEY_ALIAS')
    def ksStorePwd = System.getenv('KFTV_STORE_PASS')
    def ksKeyPwd = System.getenv('KFTV_KEY_PASS')
    if (!ksFile && rootProject.hasProperty("RELEASE_STORE_FILE")) {
        ksFile = rootProject.RELEASE_STORE_FILE
        ksAlias = rootProject.hasProperty("RELEASE_KEY_ALIAS") ? rootProject.RELEASE_KEY_ALIAS : null
        ksStorePwd = rootProject.hasProperty("RELEASE_STORE_PASSWORD") ? rootProject.RELEASE_STORE_PASSWORD : null
        ksKeyPwd = rootProject.hasProperty("RELEASE_KEY_PASSWORD") ? rootProject.RELEASE_KEY_PASSWORD : null
    }

    signingConfigs {
        release {
            storeFile      ksFile ? file(ksFile) : null
            keyAlias       ksAlias
            storePassword  ksStorePwd
            keyPassword    ksKeyPwd
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 禁用 ABI 分割
    splits {
        abi {
            enable false // 禁用 ABI 分割
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorNames = variant.productFlavors.collect { it.name }.join('-')
            // 构建自定义文件名
            def fileName = "TVBox_${variant.buildType.name}-${flavorNames}.apk"
            outputFileName = fileName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
//    dexOptions {
//        javaMaxHeapSize "4g"
//        additionalParameters += '--multi-dex'
//        additionalParameters += '--set-max-idx-number=48000'
//        additionalParameters += '--minimal-main-dex'
//    }
}

repositories {

}
