name: 构建发行版 沫兮TVBox (FongMi/TV 底座)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.0.3)'
        required: true
        default: '0.0.3'
      flavors:
        description: '要构建的 flavor(逗号分隔，如 leanback,mobile)'
        required: false
        default: 'leanback,mobile'

permissions:
  contents: write

concurrency:
  group: build-release-fongmi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 检出代码 (MXTV 分支 - FongMi/TV 源码)
        uses: actions/checkout@v4
        with:
          ref: MXTV
          submodules: false

      - name: 配置 JDK 21 (AGP 9.3.1 / Java 21 兼容)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Python (Chaquopy 17 需要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Android SDK 平台 37 / Build-Tools / NDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" >/dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > local.properties
          echo "local.properties: $(cat local.properties)"

      - name: 恢复签名 keystore (来自 Secrets)
        run: |
          set -e
          if [ -n "${{ secrets.KFTV_KEYSTORE }}" ]; then
            mkdir -p sign
            echo "${{ secrets.KFTV_KEYSTORE }}" | base64 -d > sign/kftv-release.keystore
            chmod 600 sign/kftv-release.keystore
          fi

      - name: 构建 flavor (${{ inputs.flavors }})
        env:
          KFTV_KEYSTORE_FILE: ${{ github.workspace }}/sign/kftv-release.keystore
          KFTV_KEY_ALIAS: ${{ secrets.KFTV_KEY_ALIAS }}
          KFTV_STORE_PASS: ${{ secrets.KFTV_STORE_PASS }}
          KFTV_KEY_PASS: ${{ secrets.KFTV_KEY_PASS }}
        run: |
          set -e
          chmod +x ./gradlew
          for f in $(echo "${{ inputs.flavors }}" | tr ',' ' '); do
            echo "### 构建 flavor: $f"
            cap="$(echo "$f" | sed 's/^\(.\)/\U\1/')"
            ./gradlew ":app:assemble${cap}Release" --no-daemon --stacktrace
          done

      - name: 按发版规则重命名 APK
        run: |
          set -e
          VER="${{ inputs.version }}"
          TS=$(date -u +%Y%m%d%H%M)
          mkdir -p dist
          cp -v app/build/outputs/apk/*/release/*.apk dist/ 2>/dev/null || true
          # 依 ABI 分割会产出多个 apk，统一重命名为 MoxiTVBox.{ver}.{ts}-{flavor}{abi}.apk
          cd dist
          for f in *.apk; do
            [ -e "$f" ] || continue
            base="${f%.apk}"
            # 希望格式：flavor + abi（如 leanback_arm64_v8a / mobile_universal）
            abi=$(echo "$base" | grep -oE '(arm64|armeabi|armeabi_v7a|x86|x86_64|universal|all)' | head -1 || true)
            flavor=$(echo "$base" | grep -oE '(leanback|mobile)' | head -1 || true)
            [ -n "$flavor" ] || flavor="app"
            [ -n "$abi" ] || abi="all"
            mv "$f" "MoxiTVBox.${VER}.${TS}-${flavor}-${abi}.apk"
          done
          cd "$GITHUB_WORKSPACE"
          echo "=== 产物列表 ==="
          ls -la dist/
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: 清理签名/本地配置残留 (安全)
        run: |
          set -e
          rm -f sign/kftv-release.keystore local.properties
          echo "已清理敏感文件残留"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "MoxiTVBox.${{ inputs.version }}"
          name: "沫兮TVBox ${{ inputs.version }}"
          body: |
            ## 沫兮TVBox ${{ inputs.version }} 发行版 (FongMi/TV 底座)
            - 构建时间：`${{ env.TS }}` (UTC)
            - 版本：leanback(电视版) / mobile(手机版)
            - 由 GitHub Actions 云端自动编译、正式签名。
            - 同名同签名可**覆盖更新**。
          draft: true
          files: dist/*.apk