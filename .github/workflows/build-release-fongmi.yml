name: 构建发行版 沫兮TVBox (FongMi/tangtv 底座)

on:
  # 每日定时自动构建 TV(leanback) + Mobile(mobile) 并发布
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空=自动读取 app/build.gradle 的 versionName)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-release-fongmi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码 (MXTV 分支)
        uses: actions/checkout@v4
        with:
          ref: MXTV
          submodules: false

      - name: 解析版本号 (自动/手动)
        id: ver
        run: |
          set -e
          TS=$(date -u +%Y%m%d%H%M)
          VER_IN="${{ inputs.version }}"
          if [ -z "$VER_IN" ]; then
            # 自动模式：从 app/build.gradle 读取 versionName
            VER=$(grep -oP '(?<=versionName ")[^"]+' app/build.gradle | head -1 || true)
            VER="${VER:-0.0.3}"
            AUTO=1
            echo "模式：自动(定时) 版本=$VER"
          else
            VER="$VER_IN"
            AUTO=0
            echo "模式：手动 版本=$VER"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "AUTO=$AUTO" >> "$GITHUB_ENV"

      - name: 配置 JDK 21 (AGP 9.x / Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 配置 Python 3.10 (Chaquopy 17)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Android SDK 平台/构建工具/NDK/CMake
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK="${SDK:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          CMDBIN="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$CMDBIN" ] || CMDBIN="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          echo "sdkmanager=$CMDBIN"
          yes | "$CMDBIN" --licenses >/dev/null 2>&1 || true
          yes | "$CMDBIN" "platform-tools" "platforms;android-28" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "ndk;29.0.14206865" "cmake;3.22.1" >/dev/null 2>&1 || true
          # api 37 不在 sdkmanager 稳定通道，直接安装平台压缩包
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$SDK/platforms/android-37"
          mkdir -p /tmp/platform-37 "$SDK/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          pf="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$pf"
          mv "$(dirname "$pf")" "$SDK/platforms/android-37"
          echo "platform-37 installed"
          echo "sdk.dir=$SDK" >> local.properties

      - name: 恢复签名 keystore 并生成 local.properties
        run: |
          set -e
          if [ -n "${{ secrets.KFTV_KEYSTORE }}" ]; then
            mkdir -p sign
            echo "${{ secrets.KFTV_KEYSTORE }}" | base64 -d > sign/kftv-release.keystore
            chmod 600 sign/kftv-release.keystore
          fi
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "storeFile=${{ github.workspace }}/sign/kftv-release.keystore"
            echo "keyAlias=${{ secrets.KFTV_KEY_ALIAS }}"
            echo "storePassword=${{ secrets.KFTV_STORE_PASS }}"
            echo "keyPassword=${{ secrets.KFTV_KEY_PASS }}"
          } > local.properties
          cat local.properties | sed 's/=.*/=<hidden>/'

      - name: 构建 (leanback + mobile, arm64)
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew :app:assembleLeanbackArm64_v8aRelease :app:assembleMobileArm64_v8aRelease --no-daemon --stacktrace

      - name: 按发版规则重命名 APK
        run: |
          set -e
          VER="${{ env.VER }}"
          TS="${{ env.TS }}"
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            base=$(basename "$f")
            # 期望格式：leanback-arm64_v8a.apk / mobile-arm64_v8a.apk
            mode=$(echo "$base" | sed -E 's/(leanback|mobile).*/\1/')
            abi=$(echo "$base" | sed -E 's/^[a-z]+-([a-zA-Z0-9_]+)\.apk/\1/')
            [ -n "$mode" ] && [ -n "$abi" ] && cp "$f" "dist/MoxiTVBox.${VER}.${TS}-${mode}-${abi}.apk"
          done
          echo "=== 产物 ==="
          ls -la dist/
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: 清理敏感残留
        run: |
          set -e
          rm -f sign/kftv-release.keystore local.properties
          echo "已清理"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "MoxiTVBox.${{ env.VER }}.${{ env.TS }}"
          name: "沫兮TVBox ${{ env.VER }}"
          body: |
            ## 沫兮TVBox ${{ env.VER }} 发行版 (FongMi/tangtv 底座)
            - 构建时间：`${{ env.TS }}` (UTC)
            - TV：leanback(电视版) + Mobile：mobile(手机版)，arm64
            - 云端编译、正式签名，同名同签名可覆盖更新
          files: dist/*.apk