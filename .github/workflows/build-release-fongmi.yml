name: 构建发行版 沫兮TVBox (FongMi/tangtv 底座)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.0.3)'
        required: true
        default: '0.0.3'

permissions:
  contents: write

concurrency:
  group: build-release-fongmi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码 (MXTV 分支)
        uses: actions/checkout@v4
        with:
          ref: MXTV
          submodules: false

      - name: 配置 JDK 21 (AGP 9.x / Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 配置 Python 3.10 (Chaquopy 17)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 平台/构建工具 (平台37用手动包)
        run: |
          set -e
          echo "$ANDROID_HOME"
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0" >/dev/null 2>&1 || true
          # api 37 不在 sdkmanager 稳定通道，直接安装平台压缩包
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          pf="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$pf"
          mv "$(dirname "$pf")" "$ANDROID_HOME/platforms/android-37"
          echo "platform-37 installed"
          # AGP 9 自动下载 NDK(29/28) 与 cmake(3.22.1)；若失败后面按日志补

      - name: 恢复签名 keystore 并生成 local.properties
        run: |
          set -e
          if [ -n "${{ secrets.KFTV_KEYSTORE }}" ]; then
            mkdir -p sign
            echo "${{ secrets.KFTV_KEYSTORE }}" | base64 -d > sign/kftv-release.keystore
            chmod 600 sign/kftv-release.keystore
          fi
          {
            echo "storeFile=${{ github.workspace }}/sign/kftv-release.keystore"
            echo "keyAlias=${{ secrets.KFTV_KEY_ALIAS }}"
            echo "storePassword=${{ secrets.KFTV_STORE_PASS }}"
            echo "keyPassword=${{ secrets.KFTV_KEY_PASS }}"
          } > local.properties
          cat local.properties | sed 's/=.*/=<hidden>/'

      - name: 构建 (leanback + mobile, arm64)
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew :app:assembleLeanbackArm64_v8aRelease :app:assembleMobileArm64_v8aRelease --no-daemon --stacktrace

      - name: 按发版规则重命名 APK
        run: |
          set -e
          VER="${{ inputs.version }}"
          TS=$(date -u +%Y%m%d%H%M)
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            base=$(basename "$f")
            # 期望格式：leanback-arm64_v8a.apk / mobile-arm64_v8a.apk
            mode=$(echo "$base" | sed -E 's/(leanback|mobile).*/\1/')
            abi=$(echo "$base" | sed -E 's/^[a-z]+-([a-zA-Z0-9_]+)\.apk/\1/')
            [ -n "$mode" ] && [ -n "$abi" ] && cp "$f" "dist/MoxiTVBox.${VER}.${TS}-${mode}-${abi}.apk"
          done
          echo "=== 产物 ==="
          ls -la dist/
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: 清理敏感残留
        run: |
          set -e
          rm -f sign/kftv-release.keystore local.properties
          echo "已清理"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "MoxiTVBox.${{ inputs.version }}"
          name: "沫兮TVBox ${{ inputs.version }}"
          body: |
            ## 沫兮TVBox ${{ inputs.version }} 发行版 (FongMi/tangtv 底座)
            - 构建时间：`${{ env.TS }}` (UTC)
            - leanback(电视版) / mobile(手机版)，arm64
            - 云端编译、正式签名，同名同签名可覆盖更新
          draft: true
          files: dist/*.apk