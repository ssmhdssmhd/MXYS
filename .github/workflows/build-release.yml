name: 构建发行版 (MXGTV)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.0.1 或 5.14.4)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码 (KFTV 分支)
        uses: actions/checkout@v4
        with:
          ref: KFTV
          submodules: false

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Python 3.10（Chaquopy 构建依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 配置 Android SDK（内建 + 接受许可）
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1 || true

      - name: 恢复签名 keystore (来自 Secrets)
        run: |
          set -e
          if [ -n "${{ secrets.KFTV_KEYSTORE }}" ]; then
            mkdir -p sign
            echo "${{ secrets.KFTV_KEYSTORE }}" | base64 -d > sign/kftv-release.keystore
            chmod 600 sign/kftv-release.keystore
          fi

      - name: 构建 leanback (电视版) + mobile (手机版)
        env:
          KFTV_KEYSTORE_FILE: ${{ github.workspace }}/sign/kftv-release.keystore
          KFTV_KEY_ALIAS: ${{ secrets.KFTV_KEY_ALIAS }}
          KFTV_STORE_PASS: ${{ secrets.KFTV_STORE_PASS }}
          KFTV_KEY_PASS: ${{ secrets.KFTV_KEY_PASS }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew :app:assembleLeanbackRelease :app:assembleMobileRelease --no-daemon --stacktrace

      - name: 按发版规则重命名 APK
        run: |
          set -e
          VER="${{ inputs.version }}"
          TS=$(date -u +%Y%m%d%H%M)
          mkdir -p dist
          cd Release/apk || exit 1
          for f in leanback-*.apk mobile-*.apk; do
            [ -f "$f" ] || continue
            base="${f%-*.apk}"
            ext="${f##*.}"
            name="MXGTV.${VER} ${TS}-${base}.apk"
            cp "$f" "$GITHUB_WORKSPACE/dist/$name"
          done
          cd "$GITHUB_WORKSPACE"
          echo "=== 产物列表 ==="
          ls -la dist/
          echo "APK_COUNT=$(ls dist/*.apk | wc -l)" >> "$GITHUB_ENV"
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: 校验 keystore 残留并清理 (安全)
        run: |
          set -e
          rm -f sign/kftv-release.keystore
          echo "已清理签名文件残留"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "MXGTV.${{ inputs.version }}"
          name: "MXGTV ${{ inputs.version }}"
          body: |
            ## MXGTV ${{ inputs.version }} 发行版
            - 构建时间：`${{ env.TS }}`（UTC，纪元公式中手动核对）
            - 电视版：`MXGTV.${{ inputs.version }} ${{ env.TS }}-leanback.apk`
            - 手机版：`MXGTV.${{ inputs.version }} ${{ env.TS }}-mobile.apk`
            - 由 GitHub Actions 云端自动编译、签名。
          draft: true
          files: dist/*.apk