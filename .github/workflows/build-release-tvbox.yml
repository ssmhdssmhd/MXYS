name: 构建发行版 沫兮TVBox (TVBoxOS 底座)

on:
  # 每日定时自动构建 TV(leanback) + Mobile(mobile) 并发布
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空=自动读取 app/build.gradle 的 versionName)'
        required: false
        default: ''
      flavors:
        description: '要构建的 flavor(逗号分隔，如 leanback,mobile)'
        required: false
        default: 'leanback,mobile'

permissions:
  contents: write

concurrency:
  group: build-release-tvbox
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码 (KFTV 分支 - TVBoxOS 源码)
        uses: actions/checkout@v4
        with:
          ref: KFTV
          submodules: false

      - name: 解析版本号 (自动/手动)
        id: ver
        run: |
          set -e
          TS=$(date -u +%Y%m%d%H%M)
          VER_IN="${{ inputs.version }}"
          if [ -z "$VER_IN" ]; then
            VER=$(grep -oP '(?<=versionName ")[^"]+' app/build.gradle | head -1 || true)
            VER="${VER:-0.0.2}"
            echo "模式：自动(定时) 版本=$VER"
          else
            VER="$VER_IN"
            echo "模式：手动 版本=$VER"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: 配置 JDK 17 (AGP 7.2.2 兼容)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 恢复签名 keystore (来自 Secrets)
        run: |
          set -e
          if [ -n "${{ secrets.KFTV_KEYSTORE }}" ]; then
            mkdir -p sign
            echo "${{ secrets.KFTV_KEYSTORE }}" | base64 -d > sign/kftv-release.keystore
            chmod 600 sign/kftv-release.keystore
          fi

      - name: 生成 local.properties (定位 CI Android SDK)
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -z "$SDK" ]; then SDK="$ANDROID_SDK_ROOT"; fi
          if [ -z "$SDK" ]; then
            # 兜底：标准 GH runner 安装路径
            SDK="/usr/local/lib/android/sdk"
          fi
          echo "sdk.dir=${SDK}" > local.properties
          cat local.properties

      - name: 构建 flavor (${{ inputs.flavors }})
        env:
          KFTV_KEYSTORE_FILE: ${{ github.workspace }}/sign/kftv-release.keystore
          KFTV_KEY_ALIAS: ${{ secrets.KFTV_KEY_ALIAS }}
          KFTV_STORE_PASS: ${{ secrets.KFTV_STORE_PASS }}
          KFTV_KEY_PASS: ${{ secrets.KFTV_KEY_PASS }}
        run: |
          set -e
          chmod +x ./gradlew
          for f in $(echo "${{ inputs.flavors }}" | tr ',' ' '); do
            echo "### 构建 flavor: $f"
            cap="$(echo "$f" | sed 's/^\(.\)/\U\1/')"
            ./gradlew ":app:assemble${cap}Release" --no-daemon --stacktrace
          done

      - name: 按发版规则重命名 APK
        run: |
          set -e
          VER="${{ env.VER }}"
          TS="${{ env.TS }}"
          mkdir -p dist
          # 收集所有 release APK (TVBox_release-<flavor>.apk)
          find app/build/outputs -name "*.apk" -path "*release*" 2>/dev/null | while read f; do
            base=$(basename "$f")
            # 提取 flavor：TVBox_release-leanback.apk -> leanback / mobile
            flavor=$(echo "$base" | sed -E 's/.*_release-([a-zA-Z0-9]+)\.apk/\1/')
            cp "$f" "dist/MoxiTVBox.${VER}.${TS}-${flavor}.apk"
          done
          # 兜底：若输出命名不同，收集全部 release apk
          if [ -z "$(ls dist/*.apk 2>/dev/null)" ]; then
            for f in $(find app/build/outputs/apk -name "*.apk" 2>/dev/null); do
              flavor=$(basename "$(dirname "$f")")
              cp "$f" "dist/MoxiTVBox.${VER}.${TS}-${flavor}.apk"
            done
          fi
          cd "$GITHUB_WORKSPACE"
          echo "=== 产物列表 ==="
          ls -la dist/
          echo "APK_COUNT=$(ls dist/*.apk 2>/dev/null | wc -l)" >> "$GITHUB_ENV"

      - name: 校验 keystore 残留并清理 (安全)
        run: |
          set -e
          rm -f sign/kftv-release.keystore
          echo "已清理签名文件残留"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "MoxiTVBox.${{ env.VER }}.${{ env.TS }}"
          name: "沫兮TVBox ${{ env.VER }}"
          body: |
            ## 沫兮TVBox ${{ env.VER }} 发行版 (TVBoxOS 底座)
            - 构建时间：`${{ env.TS }}` (UTC)
            - TV：leanback(电视版) + Mobile：mobile(手机版)
            - 由 GitHub Actions 云端自动编译、正式签名。
            - 同名同签名可**覆盖更新**（升级安装）。
            - 文件名：`MoxiTVBox.${{ env.VER }}.${{ env.TS }}-{flavor}.apk`
          files: dist/*.apk